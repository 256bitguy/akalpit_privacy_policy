<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Akalpit — Account Deletion Request</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Request deletion of your Akalpit account securely.">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">

  <style>
    :root{
      --bg:#0f1724;
      --card:#0b1220;
      --muted:#94a3b8;
      --accent:#f87171; /* safety red */
      --radius:14px;
      color-scheme: dark;
    }

    *{box-sizing:border-box}

    body{
      margin:0;
      min-height:100vh;
      font-family:Inter,system-ui,Segoe UI,Roboto,Arial;
      background:linear-gradient(180deg,var(--bg),#071029);
      display:flex;
      align-items:center;
      justify-content:center;
      color:#e6eef6;
    }

    .card{
      max-width:420px;
      width:100%;
      padding:28px;
      background:linear-gradient(180deg, rgba(255,255,255,0.02), rgba(255,255,255,0.01));
      border-radius:var(--radius);
      border:1px solid rgba(255,255,255,0.04);
      box-shadow:0 10px 30px rgba(0,0,0,0.6);
    }

    h1{
      font-size:20px;
      margin:0 0 8px 0;
    }

    p{
      font-size:14px;
      line-height:1.6;
      color:var(--muted);
    }

    .warning{
      margin:14px 0;
      padding:12px;
      border-radius:10px;
      background:rgba(248,113,113,0.08);
      border:1px solid rgba(255,255,255,0.04);
      font-size:13px;
      color:#fecaca;
    }

    label{
      display:block;
      margin-top:16px;
      margin-bottom:6px;
      font-size:14px;
    }

    input{
      width:100%;
      padding:12px;
      border-radius:10px;
      border:1px solid rgba(255,255,255,0.06);
      background:#020617;
      color:#fff;
      font-size:14px;
    }

    input::placeholder{
      color:#64748b;
    }

    .checkbox{
      margin-top:14px;
      display:flex;
      gap:10px;
      font-size:13px;
      color:var(--muted);
    }

    .checkbox input{
      width:auto;
      margin-top:3px;
    }

    button{
      width:100%;
      margin-top:18px;
      padding:12px;
      border-radius:12px;
      border:none;
      font-size:15px;
      font-weight:600;
      background:var(--accent);
      color:#2a0f0f;
      cursor:pointer;
    }

    button:hover{
      opacity:0.9;
    }

    footer{
      margin-top:14px;
      font-size:12px;
      color:var(--muted);
      text-align:center;
    }

    a{color:#93c5fd;text-decoration:none}
  </style>
</head>

<body>
  <div class="card" role="main">
    <h1>Delete Akalpit Account</h1>
    <p>
      You can request permanent deletion of your Akalpit account using this form.
    </p>

    <div class="warning">
      ⚠️ <strong>Warning:</strong> Account deletion is permanent.
      All your data, progress, and subscriptions will be removed and cannot be recovered.
    </div>

    <form method="POST" action="/delete-account-request">
      <!-- Replace action with your backend endpoint -->

      <label for="username">Akalpit Username / Email</label>
      <input
        id="username"
        name="username"
        type="text"
        placeholder="Enter your registered username or email"
        required
      >

      <div class="checkbox">
        <input type="checkbox" id="confirm" name="confirm" required>
        <label for="confirm">
          I understand that this action is irreversible.
        </label>
      </div>

      <button type="submit">
        Request Account Deletion
      </button>
    </form>

    <footer>
      Need help? Contact
      <a href="mailto:penlinktechnologies@gmail.com">
        penlinktechnologies@gmail.com
      </a>
    </footer>
  </div>
</body>
</html>
